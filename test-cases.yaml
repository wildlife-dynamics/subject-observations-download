# Acceptance criterion for compose#3189: a subject group made up only of stationary
# subjects (weather stations) must download. Every subject reports from one fixed
# point, which is what made Download Subject Tracks fail. Fixture: dev/fixtures/.
stationary-subjects:
  name: Stationary subjects (weather stations)
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_subjectgroup_observations: dev/fixtures/get-subjectgroup-observations-stationary.example-return.parquet
  params:
    workflow_details:
      name: "Weather Station Observations"
      description: "Download weather station readings."
    er_client_name:
      data_source:
        name: mep_dev
    time_range:
      since: "2015-01-01T00:00:00"
      until: "2015-01-07T23:59:59"
      timezone:
        label: "Africa/Nairobi (UTC+03:00)"
        tzCode: "Africa/Nairobi"
        name: "(UTC+03:00) Nairobi"
        utc: "+03:00"
    subject_obs:
      subject_group_name: "Weather Stations"
      include_details: true
    groupers:
      groupers:
        - index_name: "subject__name"
    persist_observations:
      filetypes: ["parquet", "csv"]
      filename_prefix: "weather_station_observations"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0

