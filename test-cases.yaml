month-grouper:
  name: Test Case with a monthly grouper
  mock_io: true
  params:
    workflow_details:
      name: "Ecoscope"
      description: "A workflow to download subject observations."
    time_range:
      since: "2026-01-01T00:00:00Z"
      until: "2026-01-07T23:59:59Z"
      timezone:
        label: "Africa/Nairobi (UTC+03:00)"
        tzCode: "Africa/Nairobi"
        name: "(UTC+03:00) Nairobi"
        utc: "+03:00"
    er_client_name:
      data_source:
        name: "mep_dev"
    groupers:
      groupers:
        - temporal_index: "%B"
    subject_obs:
      subject_group_name: "Ecoscope"
    filter_obs:
      filter_point_coords: [
        {"x": 180.0, "y": 90.0},
        {"x": 0.0, "y": 0.0},
        {"x": 1.0, "y": 1.0},
      ]
    persist_observations:
      filetypes: ["parquet", "csv"]
      filename_prefix: "monthly_subject_observations"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1.0
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
          opacity: 0.5
          max_zoom: 17

